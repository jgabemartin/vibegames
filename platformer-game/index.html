<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Platformer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <h1>Western NY Farm BMX Dash</h1>
    <canvas id="game" width="800" height="450"></canvas>
    <p id="hud">
      Level: <span id="level">1 — Day</span> &nbsp;|&nbsp;
      Coins: <span id="coins">0</span> / <span id="total-coins">0</span> &nbsp;|&nbsp;
      Lives: <span id="lives">3</span> &nbsp;|&nbsp;
      Time: <span id="timer">0:00.00</span> &nbsp;|&nbsp;
      Best: <span id="best-time">--:--.--</span> &nbsp;|&nbsp;
      Weather: <span id="weather">Clear</span> &nbsp;|&nbsp;
      Music: <span id="music-status">On</span>
    </p>
    <p id="instructions">Arrow keys / A D to pedal, Space or Up to hop, R to restart, M to toggle music. Watch out for the farm dogs!</p>
    <p id="message"></p>
  </div>
  <script src="music.js"></script>
  <script src="sfx.js"></script>
  <script src="game.js"></script>
</body>
</html>
